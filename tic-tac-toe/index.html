<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Jogo da Velha</h1>

    <p id="status" class="status" role="status" aria-live="polite">Vez do jogador X</p>

    <div class="board" id="board" role="grid" aria-label="Tabuleiro do jogo da velha">
      <button class="cell" data-index="0" data-testid="cell-0" aria-label="Célula 1"></button>
      <button class="cell" data-index="1" data-testid="cell-1" aria-label="Célula 2"></button>
      <button class="cell" data-index="2" data-testid="cell-2" aria-label="Célula 3"></button>
      <button class="cell" data-index="3" data-testid="cell-3" aria-label="Célula 4"></button>
      <button class="cell" data-index="4" data-testid="cell-4" aria-label="Célula 5"></button>
      <button class="cell" data-index="5" data-testid="cell-5" aria-label="Célula 6"></button>
      <button class="cell" data-index="6" data-testid="cell-6" aria-label="Célula 7"></button>
      <button class="cell" data-index="7" data-testid="cell-7" aria-label="Célula 8"></button>
      <button class="cell" data-index="8" data-testid="cell-8" aria-label="Célula 9"></button>
    </div>

    <button id="reset" class="reset-btn" data-testid="reset-button">Reiniciar jogo</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
