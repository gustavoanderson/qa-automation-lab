name: Cypress E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "tic-tac-toe/**"
      - ".github/workflows/cypress.yml"
  pull_request:
    branches: [main]
    paths:
      - "tic-tac-toe/**"
  workflow_dispatch: {}

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tic-tac-toe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: tic-tac-toe
          # A instalação já foi feita no passo acima — sem lockfile
          # comitado, o cache automático da action falha exigindo um
          # package-lock.json/yarn.lock/pnpm-lock.yaml. Como não conseguimos
          # gerar um lockfile no ambiente onde este projeto foi montado
          # (registro do npm bloqueado lá), instalamos manualmente e
          # desligamos a etapa de instalação/cache da action.
          install: false
          start: npx serve -l 8080 .
          wait-on: "http://localhost:8080"
          wait-on-timeout: 60
          browser: chrome
          # A gravação no Cypress Cloud liga sozinha assim que o segredo
          # CYPRESS_RECORD_KEY existir no repositório (ver QA-REPORT.md,
          # seção 5, para o passo a passo de configuração). Sem o segredo,
          # os testes rodam normalmente, só não sobem para o dashboard.
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots (only on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: tic-tac-toe/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: tic-tac-toe/cypress/videos
          if-no-files-found: ignore
